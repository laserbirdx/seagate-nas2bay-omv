version: "1.0"
type: dashboard-widget
data:
  id: 94f3a810-4b2c-41ef-9a22-0010754e3220
  type: datatable
  reloadPeriod: 5000
  permissions:
    role:
      - admin
  title: _("Seagate Fan, Thermal & LED (Table)")
  description: _("Displays Seagate NAS fan speed, thermal sensors and LED status in a table.")
  datatable:
    columns:
      - name: _("Sensor / Component")
        prop: sensor
        flexGrow: 2
        sortable: false
        cellTemplateName: template
        cellTemplateConfig: '{{ sensor | translate }}'
      - name: _("Value")
        prop: value
        flexGrow: 2
        sortable: false
      - name: _("Detail / Mode")
        prop: detail
        flexGrow: 2
        sortable: false
        cellTemplateName: template
        cellTemplateConfig: '{{ detail | translate }}'
    store:
      proxy:
        service: FanControl
        get:
          method: getStatus
      sorters:
        - prop: order
          dir: asc
