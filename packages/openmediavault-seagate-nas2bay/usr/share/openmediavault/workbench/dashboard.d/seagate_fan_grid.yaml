version: "1.0"
type: dashboard-widget
data:
  id: 94f3a810-4b2c-41ef-9a11-0010754e3220
  type: grid
  reloadPeriod: 5000
  permissions:
    role:
      - admin
  title: _("Seagate Fan, Thermal & LED (Cards)")
  description: _("Displays live fan speed (RPM), CPU, Ethernet PHY, disk temperatures and LED status.")
  i18n:
    - _("Chassis Fan (GPIO)")
    - _("CPU (Armada 370)")
    - _("Ethernet PHY (88E1510)")
    - _("Disks & Chassis LED")
    - _("Auto Mode")
    - _("Manual Mode")
    - _("SoC Thermal Sensor")
    - _("Gigabit PHY Sensor")
    - _("LED On")
    - _("LED Off (Night Mode)")
    - _("LED Heartbeat")
    - _("LED Disk Activity")
    - _("LED CPU Load")
  grid:
    item:
      content: '{{ sensor | translate }}<br><b>{{ value }}</b>'
      tooltip: '{{ detail | translate }}'
      class: 'omv-cursor-pointer omv-text-center omv-text-nowrap omv-background-color-pair-info'
      url: '/services/fancontrol'
    store:
      proxy:
        service: FanControl
        get:
          method: getStatus
      sorters:
        - prop: order
          dir: asc
